<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل تتبعات التحقيقات — الشؤون القانونية</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <style>
        .main-content {
            padding: 24px;
            flex: 1;
        }

        .logs-page .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #0a1628 0%, #1e4976 100%);
            padding: 20px 30px;
            border-radius: 16px;
            color: white;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            font-size: 14px;
        }

        .btn-primary {
            background: #0a1628;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-primary:hover {
            background: #142844;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(10, 22, 40, 0.3);
        }

        .btn-outline {
            background: transparent;
            color: #475569;
            border: 1.5px solid #cbd5e1;
        }

        .btn-outline:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 6px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 4px solid #0a1628;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 800;
            color: #1e293b;
        }

        .stat-card .label {
            font-size: 0.95rem;
            color: #64748b;
            font-weight: 700;
        }

        .logs-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .logs-toolbar {
            padding: 16px 20px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .filters-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filters-group select,
        .filters-group input {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: 'Tajawal', sans-serif;
            background: white;
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
            min-width: 140px;
        }

        .filters-group select:focus,
        .filters-group input:focus {
            border-color: #0a1628;
            box-shadow: 0 0 0 3px rgba(10, 22, 40, 0.15);
        }

        .filters-group #searchInput {
            min-width: 200px;
            flex: 1;
        }

        .logs-table-wrapper {
            overflow-x: auto;
        }

        .logs-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .logs-table th {
            background: #f8fafc;
            padding: 14px 16px;
            text-align: right;
            font-weight: 700;
            color: #475569;
            border-bottom: 2px solid #e2e8f0;
            white-space: nowrap;
        }

        .logs-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #f1f5f9;
            color: #1e293b;
            vertical-align: middle;
        }

        .logs-table tr:hover td {
            background: #f8fafc;
        }

        .badge-action {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            min-width: 80px;
        }

        .action-login   { background: #dbeafe; color: #1e40af; }
        .action-logout  { background: #f3e8ff; color: #6b21a8; }
        .action-add     { background: #dcfce7; color: #166534; }
        .action-edit    { background: #fef3c7; color: #92400e; }
        .action-delete  { background: #fee2e2; color: #991b1b; }
        .action-view    { background: #f1f5f9; color: #475569; }
        .action-export  { background: #ccfbf1; color: #115e59; }
        .action-print   { background: #e0f2fe; color: #075985; }
        .action-default { background: #e2e8f0; color: #475569; }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-top: 1px solid #e2e8f0;
            flex-wrap: wrap;
            gap: 12px;
        }

        .pagination-buttons {
            display: flex;
            gap: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: #94a3b8;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.3;
        }

        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #e2e8f0;
            border-radius: 50%;
            border-top-color: #0a1628;
            animation: spin 0.8s ease-in-out infinite;
            margin-bottom: 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .logs-toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .filters-group {
                flex-direction: column;
                align-items: stretch;
            }
            .filters-group input,
            .filters-group select {
                min-width: unset;
            }
        }
    </style>
</head>
<body class="logs-page">
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="page-header">
            <div>
                <h1 style="margin:0;font-size:1.8rem;font-weight:800;">🕘 سجل تتبعات التحقيقات</h1>
                <p style="margin:5px 0 0 0;opacity:0.8;">مراقبة العمليات وإجراءات المستخدمين على نظام التحقيقات</p>
            </div>
            <div style="display:flex;gap:10px;">
                <button class="btn btn-outline" style="color:white;border-color:rgba(255,255,255,0.3);" onclick="exportLogs()">
                    <i class="fa-solid fa-file-csv"></i> تصدير CSV
                </button>
                <button class="btn btn-primary" onclick="loadLogs()">
                    <i class="fa-solid fa-rotate"></i> تحديث السجل
                </button>
            </div>
        </div>

        <!-- إحصائيات سريعة -->
        <div class="stats-grid">
            <div class="stat-card" style="border-color:#3b82f6;">
                <span class="value" id="statTotal">0</span>
                <span class="label">إجمالي العمليات</span>
            </div>
            <div class="stat-card" style="border-color:#10b981;">
                <span class="value" id="statToday">0</span>
                <span class="label">عمليات اليوم</span>
            </div>
            <div class="stat-card" style="border-color:#8b5cf6;">
                <span class="value" id="statLogin">0</span>
                <span class="label">تسجيلات الدخول</span>
            </div>
            <div class="stat-card" style="border-color:#f59e0b;">
                <span class="value" id="statActions">0</span>
                <span class="label">إجراءات الحفظ/التعديل</span>
            </div>
        </div>

        <!-- جدول التتبعات -->
        <div class="logs-card">
            <div class="logs-toolbar">
                <div class="filters-group">
                    <input type="text" id="searchInput" placeholder="🔍 بحث في الوصف، اسم المستخدم، أو الصفحة..." oninput="applyFilters()">
                    
                    <select id="filterAction" onchange="applyFilters()">
                        <option value="all">كل الإجراءات</option>
                        <option value="login">تسجيل دخول</option>
                        <option value="logout">تسجيل خروج</option>
                        <option value="add">إضافة</option>
                        <option value="edit">تعديل</option>
                        <option value="delete">حذف</option>
                        <option value="view">عرض</option>
                        <option value="export">تصدير</option>
                        <option value="print">طباعة</option>
                    </select>

                    <input type="date" id="filterDate" onchange="applyFilters()">
                </div>
            </div>

            <div class="logs-table-wrapper">
                <table class="logs-table">
                    <thead>
                        <tr>
                            <th style="width:18%;">التاريخ والوقت</th>
                            <th style="width:15%;">اسم المستخدم</th>
                            <th style="width:12%;">الإجراء</th>
                            <th style="width:30%;">تفاصيل الإجراء</th>
                            <th style="width:15%;">الصفحة</th>
                            <th style="width:10%;">IP</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody">
                        <tr>
                            <td colspan="6" style="text-align:center;padding:40px;">
                                <div class="loading-spinner"></div>
                                <br>
                                <span style="color:#94a3b8;">جاري تحميل سجل العمليات...</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination">
                <span id="paginationInfo" style="font-size:13px;color:#64748b;font-weight:600;">عرض 0 - 0 من 0</span>
                <div class="pagination-buttons">
                    <button class="btn btn-outline btn-sm" id="prevBtn" onclick="prevPage()" disabled>السابق</button>
                    <span id="pageInfo" style="align-self:center;font-size:13px;font-weight:700;margin:0 10px;">الصفحة 1 من 1</span>
                    <button class="btn btn-outline btn-sm" id="nextBtn" onclick="nextPage()" disabled>التالي</button>
                </div>
            </div>
        </div>
    </div>

    <script src="sidebar.js"></script>
    <script>
        (function() {
            let logsData = [];
            let filteredLogs = [];
            let currentPage = 1;
            const PAGE_SIZE = 50;

            document.addEventListener('DOMContentLoaded', () => {
                if (typeof initSidebar === 'function') {
                    initSidebar('investigation-logs');
                }
                loadLogs();
            });

            async function loadLogs() {
                const tbody = document.getElementById('logsTableBody');
                try {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="6" style="text-align:center;padding:40px;">
                                <div class="loading-spinner"></div>
                                <br>
                                <span style="color:#94a3b8;">جاري تحميل سجل العمليات...</span>
                            </td>
                        </tr>
                    `;

                    const response = await fetch('/api/investigations/logs', {
                        headers: {
                            'X-Username': localStorage.getItem('username') || ''
                        }
                    });
                    const result = await response.json();

                    if (result.success) {
                        logsData = result.data || [];
                        applyFilters();
                    } else {
                        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:24px;color:#ef4444;">⚠️ فشل تحميل السجل: ${result.message}</td></tr>`;
                    }
                } catch (error) {
                    console.error('Error loading logs:', error);
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:24px;color:#ef4444;">⚠️ خطأ في الاتصال بالخادم</td></tr>';
                }
            }

            function applyFilters() {
                const search = document.getElementById('searchInput').value.trim().toLowerCase();
                const action = document.getElementById('filterAction').value;
                const dateVal = document.getElementById('filterDate').value;

                filteredLogs = logsData.filter(log => {
                    const matchSearch = !search ||
                        (log.user && log.user.toLowerCase().includes(search)) ||
                        (log.description && log.description.toLowerCase().includes(search)) ||
                        (log.page && log.page.toLowerCase().includes(search));

                    const matchAction = action === 'all' || log.action === action;

                    let matchDate = true;
                    if (dateVal && log.timestamp) {
                        const logDate = log.timestamp.split('T')[0];
                        matchDate = logDate === dateVal;
                    }

                    return matchSearch && matchAction && matchDate;
                });

                currentPage = 1;
                updateStats();
                renderTable();
            }

            function updateStats() {
                const total = logsData.length;
                const today = new Date().toISOString().split('T')[0];
                const todayLogs = logsData.filter(log => log.timestamp?.startsWith(today));
                const loginLogs = logsData.filter(log => log.action === 'login');
                const actionLogs = logsData.filter(log => ['add', 'edit', 'delete'].includes(log.action));

                document.getElementById('statTotal').textContent = total;
                document.getElementById('statToday').textContent = todayLogs.length;
                document.getElementById('statLogin').textContent = loginLogs.length;
                document.getElementById('statActions').textContent = actionLogs.length;
            }

            function renderTable() {
                const tbody = document.getElementById('logsTableBody');
                const total = filteredLogs.length;
                const totalPages = Math.ceil(total / PAGE_SIZE) || 1;

                if (total === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="6">
                                <div class="empty-state">
                                    <i class="fa-solid fa-clock-rotate-left"></i>
                                    <p>لم يتم العثور على أي تتبعات مطابقة للفلاتر</p>
                                </div>
                            </td>
                        </tr>
                    `;
                    document.getElementById('paginationInfo').textContent = 'عرض 0 - 0 من 0';
                    document.getElementById('pageInfo').textContent = 'الصفحة 1 من 1';
                    document.getElementById('prevBtn').disabled = true;
                    document.getElementById('nextBtn').disabled = true;
                    return;
                }

                const startIdx = (currentPage - 1) * PAGE_SIZE;
                const pageItems = filteredLogs.slice(startIdx, startIdx + PAGE_SIZE);

                const ACTION_LABELS = {
                    'login': { label: 'تسجيل دخول', class: 'action-login' },
                    'logout': { label: 'تسجيل خروج', class: 'action-logout' },
                    'add': { label: 'إضافة', class: 'action-add' },
                    'edit': { label: 'تعديل', class: 'action-edit' },
                    'delete': { label: 'حذف', class: 'action-delete' },
                    'view': { label: 'عرض', class: 'action-view' },
                    'export': { label: 'تصدير', class: 'action-export' },
                    'print': { label: 'طباعة', class: 'action-print' }
                };

                let html = '';
                pageItems.forEach(log => {
                    const actionInfo = ACTION_LABELS[log.action] || { label: log.action, class: 'action-default' };
                    html += `
                        <tr>
                            <td dir="ltr" style="text-align:right;font-weight:600;">${log.dateTime}</td>
                            <td style="font-weight:700;color:var(--navy-700);">${log.user}</td>
                            <td>
                                <span class="badge-action ${actionInfo.class}">${actionInfo.label}</span>
                            </td>
                            <td style="font-weight:500;">${log.description}</td>
                            <td style="color:#64748b;">${log.page || '—'}</td>
                            <td style="font-family:monospace;font-size:12px;">${log.ip || '—'}</td>
                        </tr>
                    `;
                });

                tbody.innerHTML = html;

                // Update pagination controls
                document.getElementById('paginationInfo').textContent = `عرض ${startIdx + 1} - ${Math.min(startIdx + PAGE_SIZE, total)} من ${total}`;
                document.getElementById('pageInfo').textContent = `الصفحة ${currentPage} من ${totalPages}`;
                document.getElementById('prevBtn').disabled = currentPage <= 1;
                document.getElementById('nextBtn').disabled = currentPage >= totalPages;
            }

            window.prevPage = function() {
                if (currentPage > 1) {
                    currentPage--;
                    renderTable();
                }
            };

            window.nextPage = function() {
                const totalPages = Math.ceil(filteredLogs.length / PAGE_SIZE) || 1;
                if (currentPage < totalPages) {
                    currentPage++;
                    renderTable();
                }
            };

            window.exportLogs = function() {
                const data = filteredLogs.length > 0 ? filteredLogs : logsData;
                if (data.length === 0) {
                    alert('⚠️ لا توجد سجلات للتصدير');
                    return;
                }

                const headers = ['التاريخ', 'المستخدم', 'الإجراء', 'الوصف', 'الصفحة', 'IP'];
                const rows = data.map(log => [
                    log.dateTime || log.timestamp,
                    log.user,
                    log.action,
                    log.description,
                    log.page || '',
                    log.ip || ''
                ]);

                let csv = headers.join(',') + '\n';
                rows.forEach(row => {
                    csv += row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',') + '\n';
                });

                const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `سجل_تتبعات_التحقيقات_${new Date().toISOString().split('T')[0]}.csv`;
                link.click();
                URL.revokeObjectURL(link.href);
            };

            window.loadLogs = loadLogs;
            window.applyFilters = applyFilters;
        })();
    </script>
</body>
</html>
