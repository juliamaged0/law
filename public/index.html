<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الشؤون القانونية — تسجيل الدخول</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  
    <script src="activity-logger.js"></script>
    
  <style>
    :root {
      --navy-900: #0a1628;
      --navy-800: #0f2240;
      --navy-700: #1a3a5c;
      --navy-600: #1e4976;
      --gold-500: #D4AF37;
      --gold-400: #E8C84A;
      --gold-300: #F2DC8A;
      --gold-100: #FDF8E8;
      --bg-page: #F4F6FA;
      --surface: #FFFFFF;
      --border: #E4EAF2;
      --text-primary: #0F172A;
      --text-muted: #94A3B8;
      --red-600: #DC2626;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Cairo', sans-serif;
      direction: rtl;
      background: var(--bg-page);
      height: 100vh;
      display: flex;
      align-items: stretch;
      overflow: hidden;
    }

    .form-panel {
      flex: 1;
      width: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 40px;
      background: var(--surface);
    }

    .brand-panel {
      flex: 1;
      width: 50%;
      background: var(--navy-900);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 40px;
      position: relative;
      overflow: hidden;
    }

    .brand-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(212,175,55,0.06) 0%, transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(30,73,118,0.4) 0%, transparent 55%);
      pointer-events: none;
    }

    .brand-logo {
      width: 200px;
      height: 200px;
      background: linear-gradient(135deg, var(--navy-700), var(--navy-600));
      border: 2px solid rgba(212,175,55,0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 900;
      color: white;
      text-align: center;
      line-height: 1.4;
      position: relative;
      z-index: 1;
    }

    .brand-gold-line {
      width: 56px;
      height: 3px;
      background: var(--gold-500);
      border-radius: 2px;
      margin: 18px auto 18px;
    }

    .brand-sub {
      font-size: 15px;
      color: rgba(255,255,255,0.45);
      text-align: center;
      line-height: 1.7;
      position: relative;
      z-index: 1;
    }

    .form-box {
      width: 100%;
      max-width: 400px;
    }

    .form-greeting {
      margin-bottom: 36px;
    }

    .form-greeting h1 {
      font-size: 28px;
      font-weight: 900;
      color: var(--navy-800);
      margin-bottom: 6px;
    }

    .form-greeting p {
      font-size: 13.5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .field-group {
      margin-bottom: 20px;
    }

    .field-label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 8px;
    }

    .field-wrap {
      position: relative;
    }

    .field-wrap input {
      width: 100%;
      height: 48px;
      padding: 0 46px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Cairo', sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      outline: none;
      transition: var(--transition);
    }

    .field-wrap input:focus {
      border-color: var(--navy-600);
      background: white;
      box-shadow: 0 0 0 4px rgba(30,73,118,0.1);
    }

    .field-icon-right {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 15px;
      pointer-events: none;
    }

    .field-icon-left {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      transition: var(--transition);
    }

    .field-icon-left:hover { color: var(--navy-700); }

    .forgot-link {
      display: block;
      margin-top: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--navy-600);
      text-decoration: none;
      text-align: left;
    }
    .forgot-link:hover { color: var(--navy-700); }

    .error-msg {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: var(--red-600);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 18px;
      display: none;
    }

    .submit-btn {
      width: 100%;
      height: 50px;
      background: var(--navy-800);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 800;
      font-family: 'Cairo', sans-serif;
      cursor: pointer;
      margin-top: 28px;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .submit-btn::before {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      left: 0;
      height: 3px;
      background: var(--gold-500);
      transform: scaleX(0);
      transition: transform 0.3s ease;
    }

    .submit-btn:hover {
      background: var(--navy-700);
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(10,22,40,0.2);
    }

    .submit-btn:hover::before { transform: scaleX(1); }
    .submit-btn:active { transform: translateY(0); }

    .user-hint {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 12px;
      font-weight: 500;
    }

    .user-hint span {
      font-weight: 700;
      color: var(--navy-600);
    }

    @media (max-width: 768px) {
      body { flex-direction: column; overflow: auto; height: auto; min-height: 100vh; }
      .brand-panel, .form-panel { width: 100%; flex: none; padding: 40px 24px; }
      .brand-title, .brand-sub { white-space: normal; }
    }
  </style>
</head>
<body>

  <section class="form-panel">
    <div class="form-box">
      <div class="form-greeting">
        <h1>أهلاً بك</h1>
        <p>سجّل دخولك للمتابعة في النظام</p>
      </div>

      <div class="error-msg" id="errorMsg">
        ❌ اسم المستخدم أو كلمة المرور غير صحيحة
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
        <div class="field-group">
          <label class="field-label" for="username">اسم المستخدم</label>
          <div class="field-wrap">
            <i class="fa-solid fa-user field-icon-right"></i>
            <input type="text" id="username" placeholder="أدخل اسم المستخدم" autocomplete="username" required>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="password">كلمة المرور</label>
          <div class="field-wrap">
            <i class="fa-solid fa-lock field-icon-right"></i>
            <i class="fa-solid fa-eye-slash field-icon-left" id="toggleEye"></i>
            <input type="password" id="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" required>
          </div>
          <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
        </div>

        <button type="submit" class="submit-btn">تسجيل الدخول</button>
      </form>
    </div>
  </section>

  <section class="brand-panel">
    <div class="brand-logo">
      <img src="images/logo.png" alt="شعار الشؤون القانونية">
    </div>
    <div class="brand-title">نظام إدارة الشؤون القانونية</div>
    <div class="brand-gold-line"></div>
    <p class="brand-sub">شركة الصرف الصحي بالإسكندرية</p>
  </section>

  <script>
    document.getElementById('toggleEye').addEventListener('click', function() {
      const inp = document.getElementById('password');
      const isPass = inp.type === 'password';
      inp.type = isPass ? 'text' : 'password';
      this.className = isPass ? 'fa-solid fa-eye field-icon-left' : 'fa-solid fa-eye-slash field-icon-left';
    });

    // جميع الصفحات المتاحة
    const ALL_PAGES = [
      { id: 'dashboard', label: 'لوحة التحكم', href: 'Dashboard.html' },
      { id: 'new-case', label: 'قضية جديدة', href: 'new_case.html' },
      { id: 'cases', label: 'جميع القضايا', href: 'Cases.html' },
      { id: 'litigation-level', label: 'درجة التقاضى', href: 'litigation-level.html' },
      { id: 'appeals-tracking', label: 'متابعة الدعاوى والأحكام', href: 'cases2.html' },
      { id: 'sessions', label: 'الجلسات', href: 'sessions.html' },
      { id: 'session-details', label: 'سجل الجلسات', href: 'session-details.html' },
      { id: 'calendar', label: 'النتيجة', href: 'calender.html' },
      { id: 'lawyers', label: 'المحامون', href: 'lawyers.html' },
      { id: 'courts', label: 'المحاكم والدوائر', href: 'courts.html' },
      { id: 'reports', label: 'التقارير والإحصائيات', href: 'reports.html' },
      { id: 'mamoriyat', label: 'تقرير المأموريات', href: 'mamoriyat.html' },
      { id: 'archive', label: 'الأرشيف', href: 'archive.html' },
      { id: 'settings', label: 'إعدادات النظام', href: 'settings.html' },
      { id: 'users', label: 'المستخدمون', href: 'access.html' },
      { id: 'investigations-dashboard', label: 'لوحة التحقيقات', href: 'investigations_dashboard.html' },
      { id: 'new-investigation', label: 'تحقيق جديد', href: 'new_investigation.html' },
      { id: 'investigation-details', label: 'متابعة التحقيقات', href: 'investigation_details.html' },
      { id: 'investigation-archive', label: 'أرشيف التحقيقات', href: 'investigation_archive.html' },
      { id: 'investigation-logs', label: 'سجل تتبعات التحقيقات', href: 'investigation_logs.html' },
      { id: 'investigation-users', label: 'مستخدمو التحقيقات', href: 'investigation_access.html' }
    ];

    // ===== المستخدمين الخفيين (مش ظاهرين في access.html) =====
    const HIDDEN_USERS = [
      { 
        username: 'admin', 
        fullName: 'مدير النظام', 
        password: '', 
        permissions: ALL_PAGES.map(p => p.id),
        hidden: true,
        readonly: false
      },
      { 
        username: 'inv', 
        fullName: 'المحقق الرئيسي', 
        password: 'inv123', 
        permissions: ['investigations-dashboard', 'new-investigation', 'investigation-details', 'investigation-archive', 'investigation-logs', 'investigation-users'],
        hidden: true,
        readonly: false,
        userRole: 'InvestigationAdmin'
      },
      { 
        username: 'CEO', 
        fullName: 'م/سامي قنديل', 
        password: 'Asdc0', 
        permissions: ['dashboard', 'appeals-tracking', 'session-details', 'calendar'],
        hidden: true,
        readonly: true
      }
    ];

    // ===== المستخدمين الظاهرين (يظهرون في access.html) =====
    const DEFAULT_VISIBLE_USERS = [
      { username: 'sessions', fullName: 'مسؤول الجلسات', password: '1234', permissions: ['sessions', 'session-details', 'calendar'] },
      { username: 'reports', fullName: 'مسؤول التقارير', password: '1234', permissions: ['reports', 'mamoriyat', 'archive'] }
    ];

    // جلب جميع المستخدمين من localStorage
    function getAllUsers() {
      try {
        const data = localStorage.getItem('customUsers');
        if (data) {
          const parsed = JSON.parse(data);
          if (Array.isArray(parsed) && parsed.length) {
            const hiddenUsernames = HIDDEN_USERS.map(u => u.username);
            const existingHidden = parsed.filter(u => hiddenUsernames.includes(u.username));
            if (existingHidden.length < HIDDEN_USERS.length) {
              const allUsers = [...HIDDEN_USERS, ...parsed.filter(u => !hiddenUsernames.includes(u.username))];
              setAllUsers(allUsers);
              return allUsers;
            }
            return parsed;
          }
        }
      } catch (e) {}
      const allUsers = [...HIDDEN_USERS, ...DEFAULT_VISIBLE_USERS];
      setAllUsers(allUsers);
      return allUsers;
    }

    function setAllUsers(users) {
      localStorage.setItem('customUsers', JSON.stringify(users));
    }

    // جلب المستخدمين الظاهرين فقط
    function getVisibleUsers() {
      const all = getAllUsers();
      return all.filter(u => !u.hidden);
    }

    // البحث عن مستخدم
    function findUser(username, password) {
      const all = getAllUsers();
      return all.find(u => 
        u.username.toLowerCase() === username.toLowerCase() && 
        u.password === password
      ) || null;
    }

    // معالجة تسجيل الدخول (تسجيل دخول هجين: سيرفر أولاً ثم محلي)
    async function handleLogin(e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.style.display = 'none';

      // 1. محاولة تسجيل الدخول عبر السيرفر (لقاعدة البيانات)
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        if (response.ok) {
          const result = await response.json();
          if (result.success && result.data) {
            const user = result.data;
            localStorage.setItem('username', user.username);
            localStorage.setItem('userPermissions', JSON.stringify(user.permissions || []));
            localStorage.setItem('userReadonly', JSON.stringify(user.readonly || false));
            if (user.role) localStorage.setItem('userRole', user.role);
            else localStorage.removeItem('userRole');
            if (user.casesRole) localStorage.setItem('casesRole', user.casesRole);
            else localStorage.removeItem('casesRole');
            
            const permissions = user.permissions || [];
            if (permissions.includes('investigations-dashboard')) {
              window.location.href = 'investigations_dashboard.html';
            } else {
              window.location.href = 'Dashboard.html';
            }
            return;
          }
        }
      } catch (err) {
        console.warn('Backend login connection failed, checking local users:', err);
      }

      // 2. محاولة تسجيل الدخول المحلي (المخزن في المتصفح)
      const user = findUser(username, password);

      if (!user) {
        errorMsg.style.display = 'block';
        return;
      }

      localStorage.setItem('username', user.username);
      localStorage.setItem('userPermissions', JSON.stringify(user.permissions || []));
      localStorage.setItem('userReadonly', JSON.stringify(user.readonly || false));
      if (user.userRole) localStorage.setItem('userRole', user.userRole);
      else localStorage.removeItem('userRole');

      // ✅ الدخول المحلي (admin / inv / CEO / اليوزرات المحلية) مبيعديش على السيرفر،
      // فلازم نسجله من هنا. (الدخول عبر قاعدة البيانات بيتسجل من السيرفر نفسه)
      try {
        if (window.logAction) {
          window.logAction('login', `تسجيل دخول المستخدم: ${user.username}`, 'تسجيل الدخول');
        }
      } catch (e) {}

      const permissions = user.permissions || [];
      
      if (permissions.includes('dashboard')) {
        window.location.href = 'Dashboard.html';
      } else if (permissions.includes('investigations-dashboard')) {
        window.location.href = 'investigations_dashboard.html';
      } else if (permissions.length > 0) {
        const firstPage = ALL_PAGES.find(p => p.id === permissions[0]);
        if (firstPage) {
          window.location.href = firstPage.href;
        } else {
          window.location.href = 'Dashboard.html';
        }
      } else {
        window.location.href = 'Dashboard.html';
      }
    }

    function checkAccess() {
      const currentPage = window.location.pathname.split('/').pop();
      
      if (currentPage === 'index.html' || currentPage === '' || currentPage === 'login.html') {
        return true;
      }

      const permissions = JSON.parse(localStorage.getItem('userPermissions') || '[]');
      
      if (!localStorage.getItem('username')) {
        window.location.href = 'index.html';
        return false;
      }

      const pageMap = {
        'Dashboard': 'dashboard',
        'new_case': 'new-case',
        'Cases': 'cases',
        'litigation-level': 'litigation-level',
        'cases2': 'appeals-tracking',
        'sessions': 'sessions',
        'session-details': 'session-details',
        'calender': 'calendar',
        'lawyers': 'lawyers',
        'courts': 'courts',
        'reports': 'reports',
        'mamoriyat': 'mamoriyat',
        'archive': 'archive',
        'settings': 'settings',
        'access': 'users',
        'users': 'users',
        'investigations_dashboard': 'investigations-dashboard',
        'new_investigation': 'new-investigation',
        'investigation_details': 'investigation-details'
      };

      const pageId = pageMap[currentPage] || currentPage;

      if (!permissions.includes(pageId)) {
        alert('⛔ غير مصرح لك بدخول هذه الصفحة.');
        if (permissions.length > 0) {
          const firstPage = ALL_PAGES.find(p => p.id === permissions[0]);
          if (firstPage) {
            window.location.href = firstPage.href;
          } else {
            window.location.href = 'index.html';
          }
        } else {
          window.location.href = 'index.html';
        }
        return false;
      }

      return true;
    }

    window.checkAccess = checkAccess;
    window.handleLogin = handleLogin;

    getAllUsers();
  </script>
</body>
</html>
