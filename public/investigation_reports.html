<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقارير التحقيقات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="activity-logger.js"></script>
<script src="sidebar.js"></script>
<link rel="stylesheet" href="css/sessions.css">
<style>
    :root {
        --navy-900:#0a2740; --navy-800:#0f3a5c; --navy-700:#14497a;
        --blue-600:#1a5a8a; --blue-500:#2a7ca8; --blue-100:#eaf3fb; --blue-50:#f5f9fd;
        --gold-600:#b8912e;
        --ink:#16232f; --muted:#5b7d9c; --muted-light:#8aa3ba;
        --border:#e2eaf2; --border-soft:#edf3f9;
        --success:#059669; --success-dark:#047857; --danger:#b91c1c; --danger-bg:#fef2f2;
        --radius-xl:20px; --radius-lg:16px; --radius-md:12px; --radius-sm:8px;
        --shadow-xs:0 1px 3px rgba(15,58,92,.06);
        --shadow-sm:0 4px 14px rgba(15,58,92,.07);
        --shadow-md:0 10px 28px rgba(15,58,92,.11);
        --ease:cubic-bezier(.22,1,.36,1);
    }
    * { box-sizing:border-box; }
    body { background:linear-gradient(180deg,#f4f8fc 0%,#eef4fa 100%); font-family:'Cairo','Segoe UI',Tahoma,sans-serif; }
    .page-body { padding:24px 28px; flex:1; font-family:'Cairo','Segoe UI',sans-serif; color:var(--ink); }
    .hidden { display:none !important; }

    /* ===== أزرار ===== */
    .control-btn {
        background:linear-gradient(135deg,var(--blue-600),var(--navy-800)); color:#fff; border:none; border-radius:40px;
        padding:11px 24px; font-family:'Cairo',sans-serif; font-weight:700; font-size:.9rem; cursor:pointer; white-space:nowrap;
        transition:transform .18s var(--ease), box-shadow .18s var(--ease);
        box-shadow:0 6px 16px rgba(15,58,92,.22);
    }
    .control-btn:hover { transform:translateY(-2px); box-shadow:0 10px 22px rgba(15,58,92,.28); }
    .control-btn.success { background:linear-gradient(135deg,#10b981,var(--success-dark)); box-shadow:0 6px 16px rgba(5,150,105,.22); }
    .control-btn.ghost { background:#fff; color:var(--blue-600); box-shadow:none; border:1.5px solid var(--border); }
    .control-btn.ghost:hover { background:var(--blue-50); border-color:#a9c8e0; }

    /* ===== رأس الصفحة ===== */
    .page-header-simple {
        display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
        padding-bottom:18px; margin-bottom:4px; border-bottom:1px solid var(--border-soft);
    }
    .page-header-simple h1 { font-size:1.5rem; font-weight:900; color:var(--navy-900); margin:0; }
    .date-badge { background:var(--blue-100); color:var(--blue-600); font-weight:700; font-size:.85rem; padding:8px 16px; border-radius:40px; border:1px solid #d7e8f6; }

    .view-fade { animation:viewFadeIn .32s var(--ease); }
    @keyframes viewFadeIn { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }

    /* ===== كروت التقارير (4 مستطيلات) ===== */
    .reports-hub-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; margin-top:26px; }
    @media (max-width:700px){ .reports-hub-grid { grid-template-columns:1fr; } }
    .report-card {
        position:relative; background:#fff; border:1px solid var(--border); border-radius:var(--radius-lg);
        padding:26px 22px 22px; cursor:pointer; box-shadow:var(--shadow-sm); text-align:center;
        display:flex; flex-direction:column; align-items:center; gap:12px; overflow:hidden;
        transition:transform .22s var(--ease), box-shadow .22s var(--ease), border-color .22s var(--ease);
    }
    .report-card .rc-header { display:flex; align-items:center; justify-content:center; gap:12px; width:100%; }
    .report-card::before {
        content:''; position:absolute; inset:0 0 auto 0; height:4px; opacity:0; transition:opacity .22s var(--ease);
        background:linear-gradient(90deg,var(--gold-600),var(--blue-600),var(--navy-900));
    }
    .report-card:hover { transform:translateY(-5px); box-shadow:var(--shadow-md); border-color:#b9d3e8; }
    .report-card:hover::before { opacity:1; }
    .report-card .rc-icon {
        width:54px; height:54px; flex-shrink:0; border-radius:16px; display:flex; align-items:center; justify-content:center;
        font-size:1.5rem; color:#fff; background:linear-gradient(135deg,var(--blue-500),var(--navy-800)); box-shadow:0 8px 18px rgba(15,58,92,.22);
    }
    .report-card .rc-title { font-weight:800; font-size:1.02rem; color:var(--navy-900); line-height:1.5; text-align:right; }
    .report-card .rc-desc { font-size:.83rem; color:var(--muted); font-weight:600; line-height:1.7; }

    /* ===== لوحة الفلاتر ===== */
    .report-filter-panel { background:#fff; border:1px solid var(--border); border-radius:var(--radius-xl); padding:26px 28px; margin-top:24px; box-shadow:var(--shadow-sm); }
    .rfp-header { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--border-soft); flex-wrap:wrap; }
    .rfp-header h2 { font-size:1.2rem; font-weight:800; color:var(--navy-900); margin:0; display:flex; align-items:center; gap:8px; }
    .rfp-header h2::before { content:''; width:6px; height:22px; border-radius:4px; background:linear-gradient(180deg,var(--gold-600),var(--blue-600)); display:inline-block; }
    .rfp-row { display:flex; gap:18px; flex-wrap:wrap; align-items:flex-end; margin-bottom:16px; }
    .rfp-field { display:flex; flex-direction:column; gap:7px; min-width:180px; }
    .rfp-field label, .rfp-field .lbl { font-size:.8rem; font-weight:700; color:var(--navy-800); }
    .rfp-field input[type="text"], .rfp-field select {
        border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; font-family:'Cairo',sans-serif;
        font-size:.88rem; color:var(--ink); background:var(--blue-50); transition:border-color .18s, box-shadow .18s;
    }
    .rfp-field input[type="text"]:focus, .rfp-field select:focus { outline:none; border-color:var(--blue-500); box-shadow:0 0 0 3px rgba(42,124,168,.15); background:#fff; }
    .rfp-field input::placeholder { color:var(--muted-light); }

    .date-field-wrap { position:relative; }
    .date-field-wrap input[type="date"] { position:absolute; inset:0; width:100%; height:100%; opacity:0; pointer-events:none; margin:0; padding:0; border:none; }
    .rfp-field .date-field-wrap input[type="text"].date-display { position:relative; z-index:3; width:100%; cursor:pointer; direction:ltr; text-align:center; }
    .date-field-wrap .date-icon { position:absolute; top:50%; left:10px; transform:translateY(-50%); pointer-events:none; color:var(--muted-light); z-index:4; }

    /* اختيار مغلقة / مفتوحة */
    .seg { display:inline-flex; background:var(--blue-50); border:1.5px solid var(--border); border-radius:40px; padding:4px; gap:4px; }
    .seg button {
        border:none; background:transparent; color:var(--muted); font-family:'Cairo',sans-serif; font-weight:800; font-size:.88rem;
        padding:8px 22px; border-radius:40px; cursor:pointer; transition:all .18s var(--ease);
    }
    .seg button.active { background:linear-gradient(135deg,var(--blue-600),var(--navy-800)); color:#fff; box-shadow:0 6px 14px rgba(15,58,92,.22); }
    .seg-note { font-size:.78rem; color:var(--muted); font-weight:600; margin-top:2px; }

    .columns-panel-label { font-size:.82rem; font-weight:700; color:var(--navy-800); margin-bottom:10px; display:block; }
    .columns-panel { display:flex; flex-wrap:wrap; gap:10px 12px; background:var(--blue-50); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:16px 18px; }
    .col-check {
        display:flex; align-items:center; gap:7px; font-size:.85rem; font-weight:700; color:var(--navy-800); cursor:pointer; user-select:none;
        background:#fff; border:1px solid var(--border); padding:7px 12px; border-radius:30px; transition:all .16s var(--ease);
    }
    .col-check:hover { border-color:var(--blue-500); }
    .col-check:has(input:checked) { background:var(--blue-600); color:#fff; border-color:var(--blue-600); }
    .col-check input { width:15px; height:15px; cursor:pointer; accent-color:var(--blue-600); }
    .col-check.locked { opacity:.85; cursor:default; }
    .col-check.locked input { cursor:default; }

    /* ===== ورقة التقرير ===== */
    .report-wrap { display:flex; justify-content:center; margin-top:24px; }
    .report-sheet {
        background:#fff; width:100%; max-width:1100px; padding:44px 48px 40px; border-radius:var(--radius-md);
        box-shadow:var(--shadow-md); border:1px solid var(--border); color:var(--ink); line-height:1.9; position:relative;
    }
    .report-sheet::before {
        content:''; position:absolute; top:0; right:0; left:0; height:6px; border-radius:var(--radius-md) var(--radius-md) 0 0;
        background:linear-gradient(90deg,var(--gold-600),var(--blue-600),var(--navy-900));
    }
    .letterhead { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
    .letterhead-en { text-align:left; flex:1; }
    .letterhead-ar { text-align:right; flex:1; }
    .en-title { font-weight:700; font-size:.92rem; }
    .en-sub { font-weight:700; font-size:.92rem; margin-top:2px; color:var(--blue-600); }
    .ar-title { font-weight:800; font-size:1.08rem; }
    .ar-sub2 { font-weight:600; font-size:.85rem; margin-top:5px; line-height:1.7; color:var(--muted); }
    .letter-divider { border:none; border-top:2px solid var(--navy-900); margin:18px 0 22px; opacity:.9; }
    .report-title-block { text-align:center; margin-bottom:24px; }
    .rt-title { font-weight:800; font-size:1.2rem; color:var(--navy-900); position:relative; display:inline-block; padding-bottom:10px; }
    .rt-title::after { content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:56px; height:3px; border-radius:4px; background:linear-gradient(90deg,var(--gold-600),var(--blue-600)); }
    .rt-period { font-weight:700; font-size:.9rem; color:var(--muted); margin-top:10px; }
    .rt-generated { font-weight:600; font-size:.78rem; color:var(--muted-light); margin-top:4px; }

    .report-stats-bar { display:flex; gap:14px; margin:16px 0 20px; flex-wrap:wrap; }
    .stat-pill { flex:1 1 150px; display:flex; align-items:center; gap:12px; padding:14px 18px; border-radius:var(--radius-md); border:1px solid var(--border); background:var(--blue-50); }
    .stat-pill .stat-icon { font-size:1.4rem; }
    .stat-pill .stat-num { font-weight:900; font-size:1.35rem; color:var(--navy-900); line-height:1; }
    .stat-pill .stat-lbl { font-weight:700; font-size:.78rem; color:var(--muted); margin-top:2px; }
    .stat-pill.win { background:#ecfdf5; border-color:#bbf0da; }
    .stat-pill.win .stat-num { color:var(--success-dark); }
    .stat-pill.total { background:#fff; }
    .stat-pill.gold { background:var(--gold-100,#faf3e2); border-color:#ecd9a6; }

    table.report-table { width:100%; border-collapse:separate; border-spacing:0; margin:8px 0 20px; font-size:.85rem; border-radius:var(--radius-sm); border:1px solid var(--navy-900); }
    table.report-table th { background:linear-gradient(135deg,var(--navy-800),var(--navy-900)); border:1px solid var(--navy-900); padding:10px 6px; font-weight:800; text-align:center; color:#fff; font-size:.85rem; }
    table.report-table td { border:1px solid #cdd9e5; padding:8px 6px; text-align:center; vertical-align:middle; word-break:break-word; overflow-wrap:break-word; }
    table.report-table tbody tr:not(.group-row):not(.total-row):nth-child(even) { background:var(--blue-50); }
    .row-index { font-weight:700; background:#fafdff !important; color:var(--muted); }
    table.report-table tr.group-row td { background:var(--blue-100); color:var(--navy-900); font-weight:800; text-align:right; padding:9px 14px; border-color:#c9dcec; }
    table.report-table tr.total-row td { background:linear-gradient(135deg,var(--gold-600),var(--navy-900)); color:#fff; font-weight:900; font-size:.98rem; border-color:var(--navy-900); padding:11px 8px; }
    .st-badge { display:inline-block; padding:2px 12px; border-radius:20px; font-size:.78rem; font-weight:800; background:#f1f5f9; color:#475569; }
    .st-badge.closed { background:#dcfce7; color:#15803d; }
    .st-badge.open { background:#fef9c3; color:#92700c; }
    .st-badge.board { background:#eff6ff; color:#2563eb; }
    .st-badge.appeal { background:#f5f3ff; color:#7c3aed; }
    .empty-hint { text-align:center; color:var(--muted-light); font-size:.85rem; font-weight:600; margin:14px 0 22px; padding:18px; background:var(--blue-50); border-radius:var(--radius-md); border:1px dashed var(--border); }
    .report-signature { margin-top:48px; text-align:left; padding-left:18px; }
    .sig-role { font-weight:800; font-size:.95rem; }
    .sig-name { font-weight:700; font-size:.92rem; color:var(--blue-600); margin-top:34px; }
    .report-footer-actions { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-top:10px; padding-top:20px; border-top:1px solid var(--border-soft); }

    /* ===== سحب وإفلات الأعمدة (زي تقارير القانونية) ===== */
    .columns-label-row { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
    .columns-label-row .columns-panel-label { margin-bottom:0; }
    .columns-label-row .control-btn { padding:7px 16px; font-size:.8rem; }
    .col-check[draggable="true"] { cursor:grab; }
    .col-check.dragging { opacity:.35; }
    .col-check.drag-over { box-shadow:0 0 0 2px var(--gold-600) inset; }
    .col-check .grip { opacity:.55; font-size:.8rem; letter-spacing:-1px; line-height:1; }

    /* ===== تكبير وتصغير عرض العمود من الجدول نفسه ===== */
    table.report-table.fixed-width-table { table-layout:fixed; width:100%; }
    table.report-table th { position:relative; }
    .col-resizer { position:absolute; top:0; bottom:0; left:-6px; width:12px; cursor:col-resize !important; user-select:none; touch-action:none; z-index:100; }
    .col-resizer::after { content:''; position:absolute; top:0; bottom:0; left:4px; width:3px; background:transparent; transition:background .1s, box-shadow .1s; }
    .col-resizer:hover::after, .col-resizer.is-resizing::after { background:#f59e0b; box-shadow:0 0 8px rgba(245,158,11,.9); }
    body.is-table-resizing { cursor:col-resize !important; user-select:none !important; }

    /* ===== تقرير المحامين: كل محامي بلوك مستقل وتحته تحقيقاته ===== */
    .lawyer-block { margin:0 0 30px; }
    .lawyer-head {
        display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
        background:linear-gradient(135deg,var(--navy-900),var(--blue-600)); color:#fff;
        padding:14px 20px; border-radius:var(--radius-md) var(--radius-md) 0 0; border:1px solid var(--navy-900); border-bottom:none;
    }
    .lh-name { display:flex; align-items:center; gap:10px; font-weight:900; font-size:1.15rem; }
    .lh-icon { width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; background:rgba(255,255,255,.16); font-size:1.1rem; }
    .lh-chips { display:flex; gap:8px; flex-wrap:wrap; }
    .lh-chip { background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.28); padding:3px 12px; border-radius:20px; font-weight:800; font-size:.78rem; }
    .lh-chip.ok { background:rgba(16,185,129,.28); }
    .lh-chip.warn { background:rgba(245,158,11,.3); }
    .lawyer-block table.report-table { margin:0; border-radius:0 0 var(--radius-sm) var(--radius-sm); }

    /* ===== سهم فلتر كل عمود ===== */
    .col-filter-wrap { display:flex; align-items:center; justify-content:center; gap:5px; }
    .col-filter-btn { background:rgba(255,255,255,.16); border:none; color:#fff; width:18px; height:18px; border-radius:5px; cursor:pointer; font-size:.62rem; line-height:1; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; padding:0; }
    .col-filter-btn:hover { background:rgba(255,255,255,.32); }
    .col-filter-btn.active-filter { background:var(--gold-600); }
    .col-filter-dropdown { position:fixed; z-index:99990; background:#fff; color:var(--ink); border:1px solid var(--border); border-radius:var(--radius-sm); box-shadow:0 10px 25px rgba(0,0,0,.18); width:230px; padding:8px; text-align:right; font-weight:600; font-size:.78rem; font-family:'Cairo',sans-serif; display:flex; flex-direction:column; }
    .col-filter-dropdown .cf-search { width:100%; border:1px solid var(--border); border-radius:6px; padding:5px 8px; font-family:'Cairo',sans-serif; font-size:.78rem; margin-bottom:6px; background:var(--blue-50); }
    .col-filter-dropdown .cf-actions { display:flex; gap:6px; margin-bottom:6px; padding-bottom:6px; border-bottom:1px solid var(--border-soft); }
    .col-filter-dropdown .cf-actions button { flex:1; border:1px solid var(--border); background:var(--blue-50); color:var(--blue-600); border-radius:6px; padding:4px 6px; font-family:'Cairo',sans-serif; font-weight:700; font-size:.72rem; cursor:pointer; }
    .col-filter-dropdown .cf-list { overflow-y:auto; flex:1; }
    .col-filter-dropdown label { display:flex; align-items:center; gap:6px; padding:3px 2px; cursor:pointer; }
    .col-filter-dropdown label:hover { background:var(--blue-50); }
    .col-filter-dropdown input[type="checkbox"] { margin:0; }

    /* ===== ترقيم الصفحات ===== */
    .table-pagination-bar { display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; margin:14px auto; padding:10px 16px; background:#fff; border:1px solid var(--border); border-radius:40px; box-shadow:var(--shadow-xs); width:fit-content; }
    .table-pagination-bar .pg-info { font-size:.82rem; font-weight:700; color:var(--muted); white-space:nowrap; }
    .table-pagination-bar .pg-nav { display:flex; align-items:center; gap:8px; }
    .table-pagination-bar button.pg-btn { background:linear-gradient(135deg,var(--blue-600),var(--navy-800)); color:#fff; border:none; border-radius:30px; padding:7px 16px; font-family:'Cairo',sans-serif; font-weight:700; font-size:.82rem; cursor:pointer; white-space:nowrap; transition:transform .15s var(--ease), box-shadow .15s var(--ease), opacity .15s; }
    .table-pagination-bar button.pg-btn:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 6px 14px rgba(15,58,92,.22); }
    .table-pagination-bar button.pg-btn:disabled { opacity:.4; cursor:not-allowed; }
    .table-pagination-bar .pg-page-indicator { font-size:.82rem; font-weight:800; color:var(--navy-900); background:var(--blue-100); border-radius:30px; padding:6px 14px; white-space:nowrap; }
    table.report-table tr.group-row.lawyer-row td { background:linear-gradient(135deg,var(--navy-900),var(--blue-600)); color:#fff; border-color:var(--navy-900); font-size:.95rem; }

    .toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(80px); background:#dc2626; color:#fff; padding:12px 24px; border-radius:12px; font-size:13px; font-weight:700; z-index:99999; transition:transform .3s ease; }
    .toast.show { transform:translateX(-50%) translateY(0); }

    @media (max-width:640px){
        .page-body { padding:14px 12px; }
        .report-sheet { padding:28px 16px 24px; overflow-x:auto; }
        .letterhead { flex-direction:column; align-items:center; text-align:center; }
        .letterhead-en, .letterhead-ar { text-align:center; }
        .report-filter-panel { padding:18px 14px; }
    }
    @media print {
        @page { size:A4 landscape; margin:8mm; }
        body * { visibility:hidden; }
        .report-sheet, .report-sheet * { visibility:visible; }
        .report-sheet { position:absolute; top:0; right:0; margin:0 auto; box-shadow:none; border:none; width:100%; max-width:100%; padding:10px 14px; }
        .no-print { display:none !important; }
        .col-resizer, .col-filter-btn, .table-pagination-bar { display:none !important; }
        .lawyer-block { margin-bottom:16px; }
        .lawyer-head { page-break-after:avoid; padding:8px 12px; }
        .lh-name { font-size:.95rem; }
        table.report-table { font-size:.68rem !important; table-layout:fixed !important; }
        table.report-table th, table.report-table td { padding:4px 3px !important; }
        table.report-table tr { page-break-inside:avoid; }
        table.report-table thead { display:table-header-group; }
        .report-signature { page-break-inside:avoid; }
        * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    }
</style>
</head>
<body>
<div id="sidebar-container"></div>
<div class="sessions-content page-body" id="pageContent">

    <div class="page-header-simple no-print">
        <h1>📊 تقارير التحقيقات</h1>
        <span class="date-badge" id="currentDateDisplay"></span>
    </div>

    <div class="view-fade">

        <!-- الشاشة الأولى: 4 مستطيلات -->
        <div id="reportsHub" class="no-print">
            <div class="reports-hub-grid" id="reportsHubGrid"></div>
        </div>

        <!-- لوحة الفلاتر -->
        <div id="reportFilterPanel" class="report-filter-panel no-print hidden">
            <div class="rfp-header">
                <h2 id="rfpTitle"></h2>
                <button class="control-btn ghost" onclick="backToHub()">↩ رجوع لكل التقارير</button>
            </div>

            <div class="rfp-row">
                <div class="rfp-field">
                    <label for="dateFrom_display">من تاريخ <span id="rfpDateHint"></span></label>
                    <div class="date-field-wrap">
                        <input type="text" class="date-display" id="dateFrom_display" placeholder="dd/mm/yyyy" readonly>
                        <span class="date-icon">📅</span>
                        <input type="date" id="dateFrom" lang="en-GB" aria-label="من تاريخ" tabindex="-1">
                    </div>
                </div>
                <div class="rfp-field">
                    <label for="dateTo_display">إلى تاريخ</label>
                    <div class="date-field-wrap">
                        <input type="text" class="date-display" id="dateTo_display" placeholder="dd/mm/yyyy" readonly>
                        <span class="date-icon">📅</span>
                        <input type="date" id="dateTo" lang="en-GB" aria-label="إلى تاريخ" tabindex="-1">
                    </div>
                </div>
                <div id="rfpExtra" style="display:contents;"></div>
                <div class="rfp-field" style="flex:1; min-width:240px;">
                    <label for="quickSearch">🔍 بحث سريع (رقم المذكرة / اسم الموظف / أي كلمة)</label>
                    <input type="text" id="quickSearch" placeholder="دوري بأي كلمة أو رقم أو اسم...">
                </div>
            </div>

            <div class="columns-label-row">
                <label class="columns-panel-label">الأعمدة الظاهرة في التقرير (اختاري ما تريدين إضافته أو حذفه — واسحبي أي عمود لمكان عمود تاني لتغيير الترتيب. ولتكبير/تصغير العمود قفي على حافته في عنوان الجدول واسحبي)</label>
                <button type="button" class="control-btn ghost" onclick="window.__resetLayout()">↺ إعادة ضبط الترتيب والعرض</button>
            </div>
            <div class="columns-panel" id="columnsPanel"></div>
        </div>

        <!-- ورقة التقرير -->
        <div id="reportSheetWrap" class="report-wrap hidden">
            <div class="report-sheet" id="reportSheet">
                <div class="letterhead">
                    <div class="letterhead-en">
                        <div class="en-title">Alexandria Sanitary Drainage Company</div>
                        <div class="en-sub">A.E.S.C.</div>
                    </div>
                    <div class="letterhead-ar">
                        <div class="ar-title">شركة الصرف الصحى بالإسكندرية</div>
                        <div class="ar-sub2">الإدارة العامة للشئون القانونية</div>
                    </div>
                </div>
                <hr class="letter-divider">

                <div class="report-title-block">
                    <div class="rt-title" id="reportTitleText"></div>
                    <div class="rt-period" id="reportPeriodText"></div>
                    <div class="rt-generated" id="reportGeneratedText"></div>
                </div>

                <div class="report-stats-bar" id="reportStatsBar"></div>

                <table class="report-table fixed-width-table" id="reportTable">
                    <colgroup id="reportColgroup"></colgroup>
                    <thead><tr id="reportTheadRow"></tr></thead>
                    <tbody id="reportTbody"></tbody>
                    <tfoot id="reportTfoot"></tfoot>
                </table>
                <div class="table-pagination-bar no-print" id="reportPagination"></div>
                <div class="empty-hint" id="reportEmptyHint" style="display:none;">لا توجد تحقيقات مطابقة للفترة أو الفلاتر المحددة.</div>

                <div class="report-signature">
                    <div class="sig-role">مدير عام الشئون القانونية</div>
                    <div class="sig-name">أ / اشرف عبد العظيم</div>
                </div>

                <div class="report-footer-actions no-print">
                    <button class="control-btn ghost" onclick="window.__clearColFilters()">↺ إلغاء كل فلاتر الأعمدة</button>
                    <button class="control-btn success" onclick="printReport()">🖨️ طباعة / حفظ PDF</button>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
    // ============================================================
    // أدوات مساعدة
    // ============================================================
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const CLOSED_STATUSES = ['مغلقة','مغلق','منتهي','منتهية'];
    // الحالات اللي معناها إن التحقيق وصل لرئيس مجلس الإدارة (عرض/قرار/طعن)
    const BOARD_STATUSES  = ['صدر قرار','طعن'];

    function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3500); }
    function isoDay(v){ if(!v) return ''; const m=String(v).match(/^(\d{4}-\d{2}-\d{2})/); if(m) return m[1]; const d=new Date(v); return isNaN(d)?'':d.toISOString().slice(0,10); }
    function fmtDate(v){ const d=isoDay(v); if(!d) return '—'; const [y,m,dd]=d.split('-'); return `${dd}/${m}/${y}`; }
    function fmtMoney(n){ return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

    const effDate    = r => isoDay(r.ReceiptDate) || isoDay(r.MemoDate);
    // اسم المحامي المسؤول: بييجي من الـ API (LawyerName من جدول المحامين) وليس اسم مدير الواقعة
    const lawyerOf   = r => String(r.LawyerName || r.ManagerName || '').trim() || 'غير محدد';
    const isClosed   = r => CLOSED_STATUSES.includes((r.Status||'').trim());
    const wentToBoard= r => !isClosed(r) && (BOARD_STATUSES.includes((r.Status||'').trim()) || Number(r.DecisionsCount||0) > 0);
    const isOpenNotBoard = r => !isClosed(r) && !wentToBoard(r);   // لسه ماوصلش لرئيس مجلس الإدارة
    const moneyOf    = r => Number(r.MaterialValue) || 0;
    function typeKey(r){
        const t=(r.InvestigationType||'').trim();
        if(/^(نوع\s*)?[أاإ]$/.test(t) || /^A$/i.test(t)) return 'أ';
        if(/^(نوع\s*)?ب$/.test(t) || /^B$/i.test(t)) return 'ب';
        return t || 'غير محدد';
    }
    const typeLabel = r => { const k=typeKey(r); return (k==='أ'||k==='ب') ? 'نوع '+k : k; };

    function statusBadge(r){
        const s=(r.Status||'جارية').trim();
        let cls='open';
        if(isClosed(r)) cls='closed'; else if(s==='طعن') cls='appeal'; else if(s==='صدر قرار') cls='board';
        const label = s==='صدر قرار' ? 'عُرض على رئيس مجلس الإدارة' : s;
        return `<span class="st-badge ${cls}">${esc(label)}</span>`;
    }

    // ============================================================
    // أعمدة مشتركة
    // ============================================================
    const COL = {
        memo:     {key:'memo',     label:'رقم المذكرة',        get:r=>esc(r.MemoNumber||'—')},
        memoDate: {key:'memoDate', label:'تاريخ المذكرة',      get:r=>fmtDate(r.MemoDate)},
        receipt:  {key:'receipt',  label:'تاريخ استلام الملف', get:r=>fmtDate(r.ReceiptDate||r.MemoDate)},
        type:     {key:'type',     label:'نوع التحقيق',        get:r=>esc(typeLabel(r))},
        emps:     {key:'emps',     label:'الموظفين المحال لهم', get:r=>esc(r.EmployeeNames||'—')},
        codes:    {key:'codes',    label:'أكواد الموظفين',     get:r=>esc(r.EmployeeCodes||'—')},
        lawyer:   {key:'lawyer',   label:'المحامي المسؤول',    get:r=>esc(lawyerOf(r))},
        place:    {key:'place',    label:'مكان الواقعة',       get:r=>esc(r.IncidentPlace||'—')},
        incDate:  {key:'incDate',  label:'تاريخ الواقعة',      get:r=>fmtDate(r.IncidentDate)},
        summary:  {key:'summary',  label:'ملخص المذكرة',       get:r=>esc(r.MemoSummary||'—')},
        status:   {key:'status',   label:'الحالة',             get:r=>statusBadge(r), text:r=>r.Status||'جارية'},
        lastDec:  {key:'lastDec',  label:'آخر قرار',           get:r=>esc(r.LastDecision||'—')},
        summons:  {key:'summons',  label:'الاستدعاءات',        get:r=>esc(r.SummonsCount??0)},
        witness:  {key:'witness',  label:'الشهود',             get:r=>esc(r.WitnessesCount??0)},
        money:    {key:'money',    label:'القيمة المادية (جنيه)', get:r=>fmtMoney(moneyOf(r)), locked:true},
        penalty:  {key:'penalty',  label:'الجزاء المتخذ',      get:r=>esc(r.PenaltyValue || r.LastDecision || '—')}
    };
    const on  = (c)=>Object.assign({default:true},  c);
    const off = (c)=>Object.assign({default:false}, c);

    // ============================================================
    // تعريف التقارير الأربعة
    // ============================================================
    const REPORTS = [
        {
            id:'overview', icon:'📋', title:'تقرير التحقيقات',
            desc:'إجمالي التحقيقات وعدد كل نوع (أ / ب) بتفاصيل التحقيق زي لوحة التحكم',
            extra:[{name:'type', label:'نوع التحقيق', options:[['','الكل'],['أ','نوع أ'],['ب','نوع ب']]}],
            columns:[on(COL.memo),on(COL.memoDate),on(COL.receipt),on(COL.emps),on(COL.lawyer),on(COL.place),on(COL.incDate),on(COL.status),on(COL.lastDec),
                     off(COL.codes),off(COL.type),off(COL.summary),off(COL.summons),off(COL.witness)],
            filter:(rows,ex)=>rows.filter(r=>!ex.type || typeKey(r)===ex.type),
            group:r=>typeLabel(r),
            stats:rows=>{
                const a=rows.filter(r=>typeKey(r)==='أ').length, b=rows.filter(r=>typeKey(r)==='ب').length;
                const other=rows.length-a-b, closed=rows.filter(isClosed).length;
                const p=[ ['total','📁',rows.length,'إجمالي التحقيقات'], ['win','🅰️',a,'تحقيقات نوع أ'], ['win','🅱️',b,'تحقيقات نوع ب'] ];
                if(other>0) p.push(['','📌',other,'أنواع أخرى']);
                p.push(['','✅',closed,'مغلقة'],['','🔓',rows.length-closed,'غير مغلقة']);
                return p;
            }
        },
        {
            id:'status', icon:'🗂️', title:'التقارير المغلقة والمفتوحة',
            desc:'المغلقة: كل التحقيقات اللي رجعت من مجلس الإدارة وحالتها مغلقة — المفتوحة: اللي لسه ماروحتش لرئيس مجلس الإدارة',
            segmented:{name:'mode', options:[['closed','🔒 مغلقة'],['open','🔓 مفتوحة']], def:'closed'},
            columns:[on(COL.memo),on(COL.memoDate),on(COL.receipt),on(COL.type),on(COL.emps),on(COL.lawyer),on(COL.status),on(COL.lastDec),
                     off(COL.codes),off(COL.place),off(COL.incDate),off(COL.summary)],
            filter:(rows,ex)=>rows.filter(ex.mode==='open' ? isOpenNotBoard : isClosed),
            stats:(rows,ex)=>[
                ['total','📁',rows.length, ex.mode==='open' ? 'تحقيقات مفتوحة (لم تُعرض على رئيس المجلس)' : 'تحقيقات مغلقة'],
                ['win','🅰️',rows.filter(r=>typeKey(r)==='أ').length,'نوع أ'],
                ['win','🅱️',rows.filter(r=>typeKey(r)==='ب').length,'نوع ب']
            ]
        },
        {
            id:'cost', icon:'💰', title:'تقرير القيمة المادية للتحقيقات',
            desc:'كل تحقيق له تكلفة مادية، وفي آخر التقرير إجمالي القيمة',
            columns:[on(COL.memo),on(COL.memoDate),on(COL.type),on(COL.emps),on(COL.lawyer),on(COL.status),
                     off(COL.receipt),off(COL.codes),off(COL.place),off(COL.incDate),off(COL.summary),
                     on(COL.money)],
            filter:rows=>rows.filter(r=>moneyOf(r)>0),
            stats:rows=>[
                ['total','📁',rows.length,'تحقيقات بها قيمة مادية'],
                ['gold','💰',fmtMoney(rows.reduce((s,r)=>s+moneyOf(r),0)),'الإجمالي (جنيه)']
            ],
            totalRow:rows=>({label:'الإجمالي', value:fmtMoney(rows.reduce((s,r)=>s+moneyOf(r),0))})
        },
        {
            id:'lawyers', icon:'⚖️', title:'تقرير المحامين',
            desc:'المحامي هو الأساس: كل محامي في بلوك لوحده وتحته كل التحقيقات اللي مسكها وتاريخ استلامه للملف',
            extra:[{name:'lawyer', label:'👤 المحامي', dynamic:'lawyers'}],
            columns:[on(COL.memo),on(COL.emps),on(COL.type),on(COL.receipt),on(COL.status),
                     off(COL.memoDate),off(COL.codes),off(COL.place),off(COL.incDate),off(COL.summary),off(COL.lastDec)],
            filter:(rows,ex)=>rows.filter(r=>!ex.lawyer || lawyerOf(r)===ex.lawyer),
            group:r=>lawyerOf(r),
            blocks:true,
            sort:(a,b)=>effDate(a).localeCompare(effDate(b)),
            stats:rows=>{
                const cl=rows.filter(isClosed).length;
                return [
                    ['win','⚖️',new Set(rows.map(lawyerOf)).size,'عدد المحامين'],
                    ['total','📁',rows.length,'إجمالي الملفات'],
                    ['','✅',cl,'مغلقة'],
                    ['','🔓',rows.length-cl,'غير مغلقة']
                ];
            }
        }
    ];

    // ============================================================
    // الحالة
    // ============================================================
    let ALL = [], cfg = null, extra = {}, visibleCols = new Set();
    const PAGE_SIZE = 20;
    let page = 1, printAll = false;
    const colFilters = {};   // { reportId: { colKey: Set(القيم المسموحة) } }
    const plain = html => { const d=document.createElement('div'); d.innerHTML=html; return d.textContent.trim(); };
    const cellText = (c,r) => plain(String(c.get(r)));

    // ============================================================
    // ترتيب وعرض الأعمدة (محفوظ في المتصفح زي تقارير القانونية)
    // ============================================================
    const WIDTHS_KEY = 'aesc_inv_report_col_widths_v1';
    const ORDER_KEY  = 'aesc_inv_report_col_order_v1';
    function loadJSON(k){ try{ return JSON.parse(localStorage.getItem(k)||'{}') || {}; }catch(e){ return {}; } }
    function saveJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
    REPORTS.forEach(r=>{ r.origKeys = r.columns.map(c=>c.key); });

    function applySavedOrder(c){
        const saved = loadJSON(ORDER_KEY)[c.id];
        if(!Array.isArray(saved)) return;
        const map = new Map(c.columns.map(x=>[x.key,x])), ordered=[];
        saved.forEach(k=>{ if(map.has(k)){ ordered.push(map.get(k)); map.delete(k); } });
        c.columns = [...ordered, ...map.values()];
    }
    function saveOrder(){
        const all = loadJSON(ORDER_KEY); all[cfg.id] = cfg.columns.map(c=>c.key); saveJSON(ORDER_KEY, all);
    }
    function colgroupHtml(cols){
        const w = loadJSON(WIDTHS_KEY)[cfg.id] || {};
        return '<col style="width:42px;">' + cols.map(c=>`<col data-col="${c.key}"${w[c.key]!=null?` style="width:${w[c.key]}%;"`:''}>`).join('');
    }
    function theadHtml(cols){
        const f = colFilters[cfg.id] || {};
        return '<tr><th style="width:42px;">#</th>' + cols.map(c=>
            `<th data-col="${c.key}"><span class="col-filter-wrap"><span class="cf-label">${c.label}</span><button type="button" class="col-filter-btn no-print${f[c.key]?' active-filter':''}" data-colkey="${c.key}" title="فلترة">▾</button></span><span class="col-resizer" title="اسحبي لتكبير أو تصغير العمود"></span></th>`).join('') + '</tr>';
    }

    function renderColumnsPanel(){
        const panel = $('columnsPanel');
        panel.innerHTML = cfg.columns.map(c=>`
            <label class="col-check ${c.locked?'locked':''}" draggable="true" data-colkey="${c.key}">
                <span class="grip" aria-hidden="true">⋮⋮</span>
                <input type="checkbox" data-col="${c.key}" ${visibleCols.has(c.key)?'checked':''} ${c.locked?'disabled':''}> ${c.label}
            </label>`).join('');
        attachColumnDrag(panel);
    }

    // سحب وإفلات: امسكي أي عمود وسيبيه على عمود تاني ياخد مكانه
    function attachColumnDrag(panel){
        let dragged = null;
        panel.querySelectorAll('.col-check').forEach(pill=>{
            pill.addEventListener('dragstart', e=>{
                dragged = pill.dataset.colkey; pill.classList.add('dragging');
                if(e.dataTransfer){ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', dragged); }
            });
            pill.addEventListener('dragend', ()=>{
                pill.classList.remove('dragging');
                panel.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));
                dragged = null;
            });
            pill.addEventListener('dragover', e=>{ e.preventDefault(); if(pill.dataset.colkey!==dragged) pill.classList.add('drag-over'); });
            pill.addEventListener('dragleave', ()=>pill.classList.remove('drag-over'));
            pill.addEventListener('drop', e=>{
                e.preventDefault(); pill.classList.remove('drag-over');
                const target = pill.dataset.colkey;
                if(!dragged || dragged===target) return;
                const from = cfg.columns.findIndex(c=>c.key===dragged), to = cfg.columns.findIndex(c=>c.key===target);
                if(from<0 || to<0) return;
                const [moved] = cfg.columns.splice(from,1);
                cfg.columns.splice(to,0,moved);
                saveOrder(); renderColumnsPanel(); render();
            });
        });
    }

    // تكبير/تصغير العمود بالسحب على حافته (بيتطبق على كل جداول المحامين مع بعض)
    $('reportSheet').addEventListener('pointerdown', e=>{
        const handle = e.target.closest('.col-resizer'); if(!handle || !cfg) return;
        e.preventDefault(); e.stopPropagation();
        const th = handle.parentElement, key = th.dataset.col, table = th.closest('table');
        const startX = e.clientX, startW = th.offsetWidth, tableW = table.offsetWidth || 1;
        const cols = [...$('reportSheet').querySelectorAll(`col[data-col="${key}"]`)];
        let pct = null;
        handle.classList.add('is-resizing'); document.body.classList.add('is-table-resizing');
        const move = ev=>{
            // الصفحة RTL: الحركة لليسار بتوسّع العمود
            const px = Math.max(35, startW + (startX - ev.clientX));
            pct = Math.max(4, Math.min(85, Math.round(px/tableW*1000)/10));
            cols.forEach(c=>c.style.width = pct+'%');
        };
        const up = ()=>{
            document.removeEventListener('pointermove', move);
            document.removeEventListener('pointerup', up);
            document.removeEventListener('pointercancel', up);
            handle.classList.remove('is-resizing'); document.body.classList.remove('is-table-resizing');
            if(pct!==null){ const all=loadJSON(WIDTHS_KEY); (all[cfg.id]=all[cfg.id]||{})[key]=pct; saveJSON(WIDTHS_KEY, all); }
        };
        document.addEventListener('pointermove', move);
        document.addEventListener('pointerup', up);
        document.addEventListener('pointercancel', up);
    });

    window.__resetLayout = function(){
        if(!cfg) return;
        const map = new Map(cfg.columns.map(c=>[c.key,c]));
        cfg.columns = cfg.origKeys.map(k=>map.get(k)).filter(Boolean);
        const o=loadJSON(ORDER_KEY); delete o[cfg.id]; saveJSON(ORDER_KEY,o);
        const w=loadJSON(WIDTHS_KEY); delete w[cfg.id]; saveJSON(WIDTHS_KEY,w);
        renderColumnsPanel(); render();
    };

    function buildHub(){
        $('reportsHubGrid').innerHTML = REPORTS.map(r=>`
            <div class="report-card" onclick="window.__openReport('${r.id}')">
                <div class="rc-header"><div class="rc-icon">${r.icon}</div><div class="rc-title">${r.title}</div></div>
                <div class="rc-desc">${r.desc}</div>
            </div>`).join('');
    }

    async function loadData(){
        try{
            const res = await fetch('/api/investigations');
            const json = await res.json();
            if(json.success===false) throw new Error(json.message||'خطأ');
            ALL = json.data || [];
        }catch(e){
            ALL = [];
            toast('تعذر تحميل التحقيقات: '+e.message);
        }
    }

    window.__openReport = async function(id){
        cfg = REPORTS.find(r=>r.id===id);
        extra = {}; page = 1; colFilters[id] = {};
        $('dateFrom').value=''; $('dateTo').value=''; syncDates();
        $('quickSearch').value='';
        await loadData();

        $('reportsHub').classList.add('hidden');
        $('reportFilterPanel').classList.remove('hidden');
        $('reportSheetWrap').classList.remove('hidden');
        $('rfpTitle').textContent = cfg.title;
        $('rfpDateHint').textContent = id==='lawyers' ? '(تاريخ الاستلام)' : '(تاريخ استلام الملف)';

        // عناصر خاصة بكل تقرير
        let html='';
        if(cfg.segmented){
            extra[cfg.segmented.name]=cfg.segmented.def;
            html += `<div class="rfp-field"><span class="lbl">عرض التحقيقات</span>
                <div class="seg" id="segBox">${cfg.segmented.options.map(([v,l])=>`<button type="button" data-seg="${v}" class="${v===cfg.segmented.def?'active':''}">${l}</button>`).join('')}</div>
                <div class="seg-note" id="segNote"></div></div>`;
        }
        (cfg.extra||[]).forEach(f=>{
            extra[f.name]='';
            let opts = f.options || [['','الكل']];
            if(f.dynamic==='lawyers'){
                const names=[...new Set(ALL.map(lawyerOf))].sort((a,b)=>a.localeCompare(b,'ar'));
                opts=[['','كل المحامين'],...names.map(n=>[n,n])];
            }
            html += `<div class="rfp-field"><label for="extra_${f.name}">${f.label}</label><select id="extra_${f.name}" data-extra="${f.name}">${opts.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select></div>`;
        });
        $('rfpExtra').innerHTML = html;

        // الأعمدة
        applySavedOrder(cfg);
        visibleCols = new Set(cfg.columns.filter(c=>c.default).map(c=>c.key));
        renderColumnsPanel();

        render();
        window.scrollTo({top:0,behavior:'smooth'});
    };

    window.backToHub = function(){
        $('reportsHub').classList.remove('hidden');
        $('reportFilterPanel').classList.add('hidden');
        $('reportSheetWrap').classList.add('hidden');
        window.scrollTo({top:0,behavior:'smooth'});
    };

    // ============================================================
    // بناء التقرير
    // ============================================================
    function baseRows(){
        const from=$('dateFrom').value, to=$('dateTo').value;
        let rows = ALL.filter(r=>{
            const d=effDate(r);
            if(from && (!d || d<from)) return false;
            if(to && (!d || d>to)) return false;
            return true;
        });
        rows = cfg.filter(rows, extra);
        const q=$('quickSearch').value.trim().toLowerCase();
        if(q){
            rows = rows.filter(r=>{
                const hay=[r.MemoNumber,r.EmployeeNames,r.EmployeeCodes,r.LawyerName,r.ManagerName,r.IncidentPlace,r.MemoSummary,r.Status,r.LastDecision,typeLabel(r),fmtDate(r.MemoDate),fmtDate(r.ReceiptDate)].join(' ').toLowerCase();
                return hay.includes(q);
            });
        }
        return rows;
    }

    // الصفوف بعد فلاتر الأعمدة (الأعمدة الظاهرة بس)
    function currentRows(){
        let rows = baseRows();
        const f = colFilters[cfg.id] || {};
        const keys = Object.keys(f).filter(k=>f[k] && visibleCols.has(k));
        if(!keys.length) return rows;
        const byKey = new Map(cfg.columns.map(c=>[c.key,c]));
        return rows.filter(r=>keys.every(k=>{ const c=byKey.get(k); return !c || f[k].has(cellText(c,r)); }));
    }

    function render(){
        if(!cfg) return;
        page = 1;
        const cols = cfg.columns.filter(c=>visibleCols.has(c.key));
        const from=$('dateFrom').value, to=$('dateTo').value;
        let title = cfg.title;
        if(cfg.id==='status') title += extra.mode==='open' ? ' — المفتوحة' : ' — المغلقة';
        $('reportTitleText').textContent = title;
        $('reportPeriodText').textContent = (!from&&!to) ? 'كل الفترات' : (from&&to) ? `من ${fmtDate(from)} إلى ${fmtDate(to)}` : from ? `من ${fmtDate(from)}` : `حتى ${fmtDate(to)}`;
        $('reportGeneratedText').textContent = 'تاريخ الإصدار: ' + fmtDate(new Date());
        if(cfg.segmented) $('segNote').textContent = extra.mode==='open'
            ? 'التحقيقات اللي لسه ماروحتش لرئيس مجلس الإدارة.'
            : 'التحقيقات اللي حالتها مغلقة (رجعت من مجلس الإدارة).';
        $('reportColgroup').innerHTML = colgroupHtml(cols);
        $('reportTheadRow').innerHTML = theadHtml(cols).replace(/^<tr>|<\/tr>$/g,'');
        renderBody();
    }

    // بيعيد رسم الصفوف والإحصائيات والصفحات بس (من غير ما يقفل قائمة الفلتر)
    function renderBody(){
        if(!cfg) return;
        const rows = currentRows();
        const cols = cfg.columns.filter(c=>visibleCols.has(c.key));
        const span = cols.length + 1;

        $('reportStatsBar').innerHTML = cfg.stats(rows, extra).map(([cls,ic,num,lbl])=>
            `<div class="stat-pill ${cls}"><span class="stat-icon">${ic}</span><div><div class="stat-num">${num}</div><div class="stat-lbl">${lbl}</div></div></div>`).join('');

        // ترتيب الصفوف (مع التجميع لو التقرير بيجمّع) في قائمة واحدة مسطحة
        const sortFn = cfg.sort || ((a,b)=>effDate(b).localeCompare(effDate(a)));
        let ordered = [];                 // [{r, g}]
        const groups = new Map();
        if(cfg.group){
            rows.forEach(r=>{ const k=cfg.group(r); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(r); });
            [...groups.keys()].sort((a,b)=>{
                if(a==='غير محدد') return 1; if(b==='غير محدد') return -1; return a.localeCompare(b,'ar');
            }).forEach(k=>{ groups.get(k).sort(sortFn).forEach(r=>ordered.push({r,g:k})); });
        } else {
            rows.slice().sort(sortFn).forEach(r=>ordered.push({r,g:null}));
        }

        const total = ordered.length;
        const totalPages = Math.max(1, Math.ceil(total/PAGE_SIZE));
        if(page>totalPages) page=totalPages; if(page<1) page=1;
        const startIdx = printAll ? 0 : (page-1)*PAGE_SIZE;
        const endIdx   = printAll ? total : Math.min(total, startIdx+PAGE_SIZE);

        let body='', lastG=undefined;
        for(let i=startIdx;i<endIdx;i++){
            const {r,g}=ordered[i];
            if(cfg.group && g!==lastG){
                lastG=g;
                const list=groups.get(g);
                if(cfg.blocks){
                    const cl=list.filter(isClosed).length;
                    body += `<tr class="group-row lawyer-row"><td colspan="${span}">⚖️ ${esc(g)} — 📁 عدد الملفات: ${list.length} &nbsp;|&nbsp; ✅ مغلقة: ${cl} &nbsp;|&nbsp; 🔓 غير مغلقة: ${list.length-cl}</td></tr>`;
                } else {
                    body += `<tr class="group-row"><td colspan="${span}">${esc(g)} — عدد التحقيقات: ${list.length}</td></tr>`;
                }
            }
            body += `<tr><td class="row-index">${i+1}</td>${cols.map(c=>`<td>${c.get(r)}</td>`).join('')}</tr>`;
        }
        $('reportTbody').innerHTML = body;

        // صف الإجمالي (القيمة المادية) — على كل الصفوف المفلترة مش الصفحة الحالية بس
        let foot='';
        if(cfg.totalRow && rows.length){
            const t = cfg.totalRow(rows);
            const mi = cols.findIndex(c=>c.key==='money');
            if(mi>=0){
                const after = cols.length - mi - 1;
                foot = `<tr class="total-row"><td colspan="${mi+1}">${t.label} (${rows.length} تحقيق)</td><td>${t.value} جنيه</td>${after>0?`<td colspan="${after}"></td>`:''}</tr>`;
            } else {
                foot = `<tr class="total-row"><td colspan="${span-1}">${t.label} (${rows.length} تحقيق)</td><td>${t.value} جنيه</td></tr>`;
            }
        }
        $('reportTfoot').innerHTML = foot;
        $('reportTable').style.display = rows.length ? '' : 'none';
        $('reportEmptyHint').style.display = rows.length ? 'none' : '';

        // شريط الصفحات
        const bar = $('reportPagination');
        if(total <= PAGE_SIZE){ bar.innerHTML=''; bar.style.display='none'; }
        else {
            bar.style.display='flex';
            bar.innerHTML = `
                <span class="pg-info">عرض ${startIdx+1}–${endIdx} من إجمالي ${total} تحقيق</span>
                <div class="pg-nav">
                    <button type="button" class="pg-btn" onclick="window.__changePage(-1)" ${page<=1?'disabled':''}>→ السابق</button>
                    <span class="pg-page-indicator">صفحة ${page} من ${totalPages}</span>
                    <button type="button" class="pg-btn" onclick="window.__changePage(1)" ${page>=totalPages?'disabled':''}>التالي ←</button>
                </div>`;
        }

        // لون زر الفلتر لو عليه فلتر شغال
        const f = colFilters[cfg.id] || {};
        document.querySelectorAll('#reportTable thead .col-filter-btn').forEach(b=>b.classList.toggle('active-filter', !!f[b.dataset.colkey]));
    }

    window.__changePage = function(d){
        page += d; renderBody();
        $('reportSheet').scrollIntoView({behavior:'smooth', block:'start'});
    };
    window.__clearColFilters = function(){
        if(!cfg) return;
        colFilters[cfg.id] = {}; closeDd(); page = 1; renderBody();
    };

    // الطباعة: تظهر كل الصفوف مش الصفحة الحالية بس
    window.addEventListener('beforeprint', ()=>{ if(cfg){ printAll=true; renderBody(); } });
    window.addEventListener('afterprint',  ()=>{ if(printAll){ printAll=false; renderBody(); } });

    // ============================================================
    // قائمة فلتر العمود (زي تقارير القانونية)
    // ============================================================
    function closeDd(){ document.querySelectorAll('.col-filter-dropdown').forEach(d=>d.remove()); }
    document.addEventListener('click', e=>{
        if(!e.target.closest('.col-filter-dropdown') && !e.target.closest('.col-filter-btn')) closeDd();
    });
    window.addEventListener('scroll', e=>{
        if(e.target && e.target.nodeType===1 && e.target.closest('.col-filter-dropdown')) return;
        closeDd();
    }, true);

    $('reportSheet').addEventListener('click', e=>{
        const btn = e.target.closest('.col-filter-btn'); if(!btn || !cfg) return;
        e.stopPropagation(); openFilterDropdown(btn);
    });

    function openFilterDropdown(btn){
        const key = btn.dataset.colkey;
        const wasOpen = document.querySelector(`.col-filter-dropdown[data-for="${key}"]`);
        closeDd(); if(wasOpen) return;
        const col = cfg.columns.find(c=>c.key===key); if(!col) return;

        const values = [...new Set(baseRows().map(r=>cellText(col,r)))].sort((a,b)=>a.localeCompare(b,'ar',{numeric:true}));
        const f = colFilters[cfg.id] = colFilters[cfg.id] || {};
        const selected = f[key] ? new Set(f[key]) : new Set(values);

        const dd = document.createElement('div');
        dd.className = 'col-filter-dropdown'; dd.dataset.for = key;
        dd.innerHTML = `
            <input type="text" class="cf-search" placeholder="🔍 بحث في القيم...">
            <div class="cf-actions"><button type="button" data-act="all">تحديد الكل</button><button type="button" data-act="none">إلغاء الكل</button></div>
            <div class="cf-list">${values.map((v,i)=>`<label><input type="checkbox" data-i="${i}" ${selected.has(v)?'checked':''}><span>${esc(v)||'(فارغ)'}</span></label>`).join('')}</div>`;
        document.body.appendChild(dd);

        // مكان القائمة تحت السهم مباشرة (وماتخرجش برا الشاشة)
        const rc = btn.getBoundingClientRect();
        dd.style.maxHeight = Math.max(160, Math.min(340, window.innerHeight - rc.bottom - 16)) + 'px';
        let left = rc.right - dd.offsetWidth;
        left = Math.max(8, Math.min(left, window.innerWidth - dd.offsetWidth - 8));
        dd.style.left = left + 'px'; dd.style.top = (rc.bottom + 4) + 'px';

        const commit = ()=>{
            const checked = [...dd.querySelectorAll('.cf-list input')].filter(cb=>cb.checked).map(cb=>values[+cb.dataset.i]);
            // مفيش اختيار أو كله مختار = مفيش فلتر على العمود
            if(checked.length===0 || checked.length===values.length) delete f[key]; else f[key] = new Set(checked);
            page = 1; renderBody();
        };
        const visibleBoxes = ()=>[...dd.querySelectorAll('.cf-list label')].filter(l=>l.style.display!=='none').map(l=>l.querySelector('input'));
        dd.querySelector('[data-act="all"]').addEventListener('click', ()=>{ visibleBoxes().forEach(cb=>cb.checked=true); commit(); });
        dd.querySelector('[data-act="none"]').addEventListener('click', ()=>{ visibleBoxes().forEach(cb=>cb.checked=false); commit(); });
        dd.querySelectorAll('.cf-list input').forEach(cb=>cb.addEventListener('change', commit));
        dd.querySelector('.cf-search').addEventListener('input', ev=>{
            const q = ev.target.value.trim().toLowerCase();
            dd.querySelectorAll('.cf-list label').forEach(l=>{ l.style.display = l.textContent.toLowerCase().includes(q) ? '' : 'none'; });
        });
        dd.querySelector('.cf-search').focus();
    }

    window.printReport = function(){
        const old=document.title; document.title = cfg ? cfg.title : 'تقرير';
        window.print(); document.title = old;
    };

    // ============================================================
    // التواريخ (عرض dd/mm/yyyy)
    // ============================================================
    function syncDates(){
        ['dateFrom','dateTo'].forEach(id=>{ $(id+'_display').value = $(id).value ? fmtDate($(id).value) : ''; });
    }
    ['dateFrom','dateTo'].forEach(id=>{
        const disp=$(id+'_display'), nat=$(id);
        disp.addEventListener('click',()=>{ try{ nat.showPicker ? nat.showPicker() : nat.focus(); }catch(e){ nat.focus(); } });
        nat.addEventListener('change',()=>{ syncDates(); render(); });
    });

    // ============================================================
    // الأحداث
    // ============================================================
    $('quickSearch').addEventListener('input', render);
    $('columnsPanel').addEventListener('change', e=>{
        const k=e.target.dataset.col; if(!k) return;
        e.target.checked ? visibleCols.add(k) : visibleCols.delete(k);
        render();
    });
    $('rfpExtra').addEventListener('change', e=>{
        const n=e.target.dataset.extra; if(!n) return;
        extra[n]=e.target.value; render();
    });
    $('rfpExtra').addEventListener('click', e=>{
        const b=e.target.closest('[data-seg]'); if(!b) return;
        extra[cfg.segmented.name]=b.dataset.seg;
        $('segBox').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));
        render();
    });

    $('currentDateDisplay').textContent = new Date().toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
    buildHub();
    document.addEventListener('DOMContentLoaded', function(){
        if (typeof initSidebar === 'function') initSidebar('investigation-reports');
    });
})();
</script>
</body>
</html>
